[project]
name = "marsdog-action-executor"
version = "0.1.0"
description = "MarsDog bionic robot dog behavior execution engine — converts behavior_name goals into staged action plans and drives execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marsdog-observability==0.2.0",
    "pyyaml>=6.0",
    "pytest>=9.0",
    "numpy>=2.2.6",
]

[project.scripts]
marsdog-action-demo = "marsdog_action_executor.standalone_demo:main"
action_executor_node = "marsdog_action_executor.ros_node:main"
emotion_display = "marsdog_action_executor.emotion_display:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marsdog_action_executor"]

[tool.hatch.build.targets.wheel.shared-data]
"config" = "share/marsdog_action_executor/config"
"launch" = "share/marsdog_action_executor/launch"
"action" = "share/marsdog_action_executor/action"
"package.xml" = "share/marsdog_action_executor/package.xml"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_testing_ros"

[tool.uv.sources]
marsdog-observability = { path = "../../packages/observability" }
