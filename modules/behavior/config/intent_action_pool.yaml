# intent_behavior_pool.yaml — intent → 候选 behavior_name 池
#
# 注意：此文件中所有行为名均为语义 Behavior，不得出现 ACT_*。
# ACT_* 动作选择由 marsdog_action_executor 根据 behavior_name + params 决定。

# ═══════════════════════════════════════════════════════════════════════════
# audio_direct intents
# ═══════════════════════════════════════════════════════════════════════════

orient_to_sound:
  candidates: [respond_owner_call]
  aliases:
    respond_owner_call: respond_owner_call

command_sit:
  candidates: [sit_down]
  aliases:
    respond_owner_call: sit_down

command_come_here:
  candidates: [come_to_owner]
  aliases:
    respond_owner_call: come_to_owner

command_follow:
  candidates: [follow_owner]
  aliases:
    respond_owner_call: follow_owner

command_handshake:
  candidates: [give_paw]
  aliases:
    respond_touch_head: give_paw

command_high_five:
  candidates: [high_five]
  aliases:
    respond_touch_head: high_five

command_roll:
  candidates: [roll_over]
  aliases:
    rollOverShowBelly: roll_over
    expressJoy: roll_over

command_spin:
  candidates: [spin_around]
  aliases:
    spinInCircle: spin_around
    expressJoy: spin_around

command_retrieve:
  candidates: [return_to_owner]
  aliases:
    respond_owner_call: return_to_owner

command_spit_out:
  candidates: [drop_object]
  aliases:
    emergency_stop: drop_object

command_play_dead:
  candidates: [play_dead]
  aliases:
    restInPlace: play_dead
    expressCalm: play_dead

emergency_stop:
  candidates: [emergency_stop]
  aliases:
    emergency_stop: emergency_stop

express_joy:
  candidates: [expressJoy]
  aliases:
    express_happy: expressJoy

comfort_owner:
  candidates: [expressJoy, expressCalm]
  aliases:
    express_happy: expressJoy

confused_response:
  candidates: [expressCuriosity, expressAnxiety]
  aliases:
    headTilt: expressCuriosity
    stareIntently: expressAnxiety

# Voice command specific intents (EVT_VOICE_COMMAND_<ACTION>)
command_lie_down:
  candidates: [lie_down]
  aliases:
    respond_owner_call: lie_down

command_stand_up:
  candidates: [stand_up]
  aliases:
    respond_owner_call: stand_up

command_wait:
  candidates: [wait_in_place]
  aliases:
    respond_owner_call: wait_in_place

command_bring:
  candidates: [bring_object]
  aliases:
    respond_owner_call: bring_object

command_fetch:
  candidates: [fetch_object]
  aliases:
    respond_owner_call: fetch_object

