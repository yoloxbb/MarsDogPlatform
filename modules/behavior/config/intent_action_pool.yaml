# intent_behavior_pool.yaml — intent → 候选 behavior_name 池
#
# 注意：此文件中所有行为名均为语义 Behavior，不得出现 ACT_*。
# ACT_* 动作选择由 marsdog_action_executor 根据 behavior_name + params 决定。

# ═══════════════════════════════════════════════════════════════════════════
# audio_direct intents
# ═══════════════════════════════════════════════════════════════════════════

orient_to_sound:
  candidates: [respond_owner_call]
  aliases:
    respond_owner_call: respond_owner_call

# Internal session continuation created only after wake orientation succeeds
# and BehaviorTree resolves one immutable visual target.
approach_wake_speaker:
  candidates: [approach_voice_caller]

command_walk:
  candidates: [walk_to_random_point]

command_play_alone:
  candidates: [play_alone]

command_go_out:
  candidates: [go_out_to_play]

command_go_home:
  candidates: [go_home]

command_approach:
  candidates: [approach_owner]

command_back_up:
  candidates: [back_up]

command_sit:
  candidates: [sit_down]
  aliases:
    respond_owner_call: sit_down

command_come_here:
  candidates: [come_to_owner]
  aliases:
    respond_owner_call: come_to_owner

command_follow:
  candidates: [follow_owner]
  aliases:
    respond_owner_call: follow_owner

command_handshake:
  candidates: [give_paw]
  aliases:
    respond_touch_head: give_paw

command_high_five:
  candidates: [high_five]
  aliases:
    respond_touch_head: high_five

command_roll:
  candidates: [roll_over]
  aliases:
    rollOverShowBelly: roll_over
    expressJoy: roll_over

command_spin:
  candidates: [spin_around]
  aliases:
    spinInCircle: spin_around
    expressJoy: spin_around

command_retrieve:
  candidates: [return_to_owner]
  aliases:
    respond_owner_call: return_to_owner

command_spit_out:
  candidates: [drop_object]
  aliases:
    emergency_stop: drop_object

command_play_dead:
  candidates: [play_dead]
  aliases:
    restInPlace: play_dead
    expressCalm: play_dead

command_stand_still:
  candidates: [stand_still]

command_hold_position:
  candidates: [hold_position]

command_quiet:
  candidates: [quiet]

# Voice commands gated by the current authoritative internal-need value.
# The gate is declared in event_intent_map.yaml; after it passes these reuse
# the existing physiological behaviors and their result-settlement semantics.
command_toilet:
  candidates: [barkShortAlert]

command_clean:
  candidates: [lickPaws]

command_sleep:
  candidates: [sleepOnSide]

emergency_stop:
  candidates: [emergency_stop]
  aliases:
    emergency_stop: emergency_stop

