  # Reused physiological behaviors for need-gated voice commands.  Physical
  # stages remain authoritative in MarsDogAction's behavior table.
  # 2026-09-18: 180 s, not 60.  This budget is sent as the ROS goal timeout and
  # covers navigation *and* every stage, and 上厕所 now spends 47.1 s walking
  # three laps around the spot (0.5 m radius at the 0.20 m/s cap) after the
  # trip to the 卫生间.  At 60 s the executor would clamp the last lap to the
  # leftover budget and fail the whole behavior.
  barkShortAlert:
    priority_level: 1
    base_priority: 80
    interrupt_policy: immediate
    timeout_sec: 180.0
    cooldown_sec: 0.2
    action_sequence: []
    style_modifiers: {}

