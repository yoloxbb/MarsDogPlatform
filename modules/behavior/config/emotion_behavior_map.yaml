# emotion_behavior_map.yaml
# 情绪 V2 单阈值事件 → 语义 Behavior
# 所有 ACT_* 动作选择由 marsdog_action_executor 负责

# 非平静情绪在一次上升沿触发后，可在当前状态仍为 triggered 时续排。
# 通过次数和总时长双重限制，避免底盘无限执行情绪动作。
emotion_continuation:
  enabled: true
  interval_sec: 0.8
  max_cycles: 4
  max_duration_sec: 15.0
  emotions: [Fear, Anxiety, Excite, Joy, Curious]

emotion_behavior_map:
  EMO_CALM_TRIGGERED:
    intent: express_calm
    priority_level: 5
    sub_priority: 0
    level: LOW
    variant: calm
    allow_repeat: true
    visual_required: person_presence
    routes:
      human:
        behavior_name: expressCalmWithHuman
        interaction_mode: interactive
      solo:
        behavior_name: expressCalmAlone
        interaction_mode: solo
    result_mapping: null

  EMO_JOY_TRIGGERED:
