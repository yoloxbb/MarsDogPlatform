# ═══════════════════════════════════════════════════════════════════════════
# audio_reaction — 词库社交反应
# 非动作命令，但允许 Tree 执行一次性表达。
audio_reaction:
  EVT_VOICE_COMMAND_PRAISE:
    category: external_interaction
    intent: audio_react_praise
    expected_command_id: CMD_PRAISE
    expected_social: PRAISE
    sub_priority: 1
    ttl_sec: 5.0
    timeout_sec: 8.0
    cooldown_sec: 2.0
    interrupt_policy: immediate
    reactions:
      - {emotion: Joy, weight: 1.0}
      - {emotion: Excite, weight: 1.0}

  EVT_VOICE_COMMAND_SCOLD:
    category: external_interaction
    intent: audio_react_scold
    expected_command_id: CMD_SCOLD
    expected_social: SCOLD
    sub_priority: 1
    ttl_sec: 5.0
    timeout_sec: 8.0
    cooldown_sec: 2.0
    interrupt_policy: immediate
    reactions:
      - {emotion: Anxiety, weight: 1.0}
      - {emotion: Curious, weight: 1.0}
      - {emotion: Fear, weight: 1.0}

# visual_direct — /perception/visual_event events[] 白名单
# ═══════════════════════════════════════════════════════════════════════════

# 直接视觉安全事件均为 Lv1，sub_priority=12。
visual_direct:
  EVT_VISION_FALL:
    category: external_interaction
    intent: visual_fall_response
    semantic_rank: 0  # confirmed safety event
    sub_priority: 12
    ttl_sec: 8.0
    interrupt_policy: immediate

  EVT_VISION_STOP_GESTURE:
    category: external_interaction
    intent: visual_stop_gesture_response
    semantic_rank: 0  # confirmed safety/control event
    sub_priority: 12
    ttl_sec: 8.0
    interrupt_policy: immediate

# need — 需求等级变化事件 → category + intent
need:
  NEED_HUNGER_TRIGGERED:
    category: normal_physiology
    visual_required: hunger_food_context
    # 2026-09-18: 到达点位后的进食仪式 (低头→抬头→趴下→站立→再低头→左右扭腰)
    # 在导航之后还要跑约 20 s，默认 30 s (level 3) 不够，且同一预算同时覆盖导航。
    timeout_sec: 180.0
    routes:
      dog_food:
        intent: eat_normal
        behavior_name: eatNormally
        variant: food_visible
      no_dog_food:
        intent: seek_food
        behavior_name: seekFood
        variant: food_search

  NEED_HUNGER_OVERFLOW:
    category: normal_physiology
    visual_required: hunger_food_context
    # 2026-09-18: 到达点位后的进食仪式 (低头→抬头→趴下→站立→再低头→左右扭腰)
    # 在导航之后还要跑约 20 s，默认 30 s (level 3) 不够，且同一预算同时覆盖导航。
    timeout_sec: 180.0
    routes:
      dog_food:
        intent: eat_excited
        behavior_name: eatExcitedly
        variant: food_visible_urgent
      no_dog_food:
        intent: seek_food_urgent
        behavior_name: seekFoodUrgently
        variant: food_search_urgent
        params:
          executor_behavior_name: seekFood

  NEED_BLADDER_TRIGGERED:
    category: urgent_physiology
    intent: request_elimination
    behavior_name: barkShortAlert
    variant: request

  NEED_SLEEPINESS_TRIGGERED:
    category: urgent_physiology
    intent: settle_to_sleep
    behavior_name: sleepOnSide
    variant: light

  NEED_SLEEPINESS_OVERFLOW:
    category: urgent_physiology
    intent: sleep_deep
    behavior_name: sleepNow
    variant: deep

  NEED_CLEANLINESS_TRIGGERED:
    category: normal_physiology
    intent: groom_light
    behavior_name: lickPaws
    variant: light

  NEED_ENERGY_TRIGGERED:
    category: safety
    intent: recover_energy
    behavior_name: restInPlace
    variant: low_energy
    # restInPlace is also routed through Nav2 to charging waypoint B.
    # Keep its tree-side deadline above Nav2's default 300 s timeout.
    timeout_sec: 330.0

  NEED_ENERGY_OVERFLOW:
    category: safety
    intent: recharge_critical
    behavior_name: recharge
    variant: critical
    # Covers Nav2's default 300 s route timeout plus the recharge stage.
    timeout_sec: 330.0

  NEED_SOCIAL_TRIGGERED:
    category: psychological_need
    visual_required: social_target
    sub_priority: 2
    routes:
      human:
        intent: human_attention_interaction
        behavior_name: seekHumanInteraction
        variant: human_seek
