# event_intent_map.yaml — 事件 → category → intent 映射
#
# 三类来源：audio_direct / need / emotion
# visual 事件不在此映射中（仅用于 active_target 缓存）

# ═══════════════════════════════════════════════════════════════════════════
# audio_direct — 白名单事件
# ═══════════════════════════════════════════════════════════════════════════

audio_direct:
  EVT_VOICE_CALL_NAME:
    category: external_interaction
    intent: orient_to_sound
    sub_priority: 1    # 听觉
    params:
      use_wake_angle: true

  EVT_VOICE_COMMAND_KNOWN:
    command_map:
      CMD_SIT:
        category: external_interaction
        intent: command_sit
        sub_priority: 1

      CMD_COME_HERE:
        category: external_interaction
        intent: command_come_here
        sub_priority: 1

      CMD_FOLLOW:
        category: external_interaction
        intent: command_follow
        sub_priority: 1

      CMD_HAND:
        category: external_interaction
        intent: command_handshake
        sub_priority: 1

      CMD_FIVE:
        category: external_interaction
        intent: command_high_five
        sub_priority: 1

      CMD_ROLL:
        category: external_interaction
        intent: command_roll
        sub_priority: 1

      CMD_SPIN:
        category: external_interaction
        intent: command_spin
        sub_priority: 1

      CMD_BACK:
        category: external_interaction
        intent: command_retrieve
        sub_priority: 1

      CMD_SPIT:
        category: safety
        intent: command_spit_out
        sub_priority: 1

      CMD_DEAD:
        category: external_interaction
        intent: command_play_dead
        sub_priority: 1

      CMD_STOP:
        category: safety
        intent: emergency_stop
        sub_priority: 1

      CMD_PRAISE:
        category: emotion_expression
        intent: express_joy
        sub_priority: 1

      CMD_ENCOUR:
        category: emotion_expression
        intent: express_joy
        sub_priority: 1

      CMD_COMFORT:
        category: external_interaction
        intent: comfort_owner
        sub_priority: 1

  EVT_VOICE_COMMAND_UNKNOWN:
    category: external_interaction
    intent: confused_response
    sub_priority: 1
    enabled: false

# ═══════════════════════════════════════════════════════════════════════════
# need — 需求等级变化事件 → category + intent
# ═══════════════════════════════════════════════════════════════════════════

need:
  NEED_HUNGER_TRIGGERED:
    category: normal_physiology
    intent: eat_normal
    behavior_name: eatNormally

  NEED_HUNGER_OVERFLOW:
    category: normal_physiology
    intent: eat_excited
    behavior_name: eatExcitedly

  NEED_BLADDER_TRIGGERED:
    category: urgent_physiology
    intent: eliminate
    behavior_name: defecate

  NEED_BLADDER_OVERFLOW:
    category: urgent_physiology
    intent: eliminate
    behavior_name: defecate

  NEED_SLEEPINESS_TRIGGERED:
    category: urgent_physiology
    intent: sleep_shallow
    behavior_name: sleepNow
    variant: shallow

  NEED_SLEEPINESS_OVERFLOW:
    category: urgent_physiology
    intent: sleep_deep
    behavior_name: sleepNow
    variant: deep

  NEED_CLEANLINESS_TRIGGERED:
    category: normal_physiology
    intent: self_groom
    behavior_name: cleanSelf

  NEED_ENERGY_TRIGGERED:
    category: safety
    intent: recover_energy
    behavior_name: restInPlace
    variant: low_energy

  NEED_ENERGY_OVERFLOW:
    category: safety
    intent: recharge_critical
    behavior_name: recharge
    variant: critical

  NEED_SOCIAL_TRIGGERED:
    category: psychological_need
    intent: social_seek
    # Fine-grained intent resolved by state_event_refiner.py

  NEED_SOCIAL_OVERFLOW:
    category: psychological_need
    intent: social_seek
    # Fine-grained intent resolved by state_event_refiner.py

  NEED_EXPLORATION_TRIGGERED:
    category: psychological_need
    intent: explore_space
    behavior_name: exploreRoom

# ═══════════════════════════════════════════════════════════════════════════
# emotion — 情绪区间变化事件 → 6个正式语义行为
# 由 config/emotion_behavior_map.yaml 提供完整映射
# ═══════════════════════════════════════════════════════════════════════════

emotion:
  EMO_JOY_LOW:
    category: emotion_expression
  EMO_JOY_MID:
    category: emotion_expression
  EMO_JOY_HIGH:
    category: emotion_expression
  EMO_EXCITE_LOW:
    category: emotion_expression
  EMO_EXCITE_HIGH:
    category: emotion_expression
  EMO_ANXIETY_LOW:
    category: emotion_expression
  EMO_ANXIETY_HIGH:
    category: emotion_expression
  EMO_FEAR_LOW:
    category: emotion_expression
  EMO_FEAR_HIGH:
    category: emotion_expression
  EMO_CURIOUS_LOW:
    category: emotion_expression
  EMO_CURIOUS_HIGH:
    category: emotion_expression
  EMO_CALM_NORMAL:
    category: emotion_expression
  EMO_CALM_HIGH:
    category: emotion_expression
