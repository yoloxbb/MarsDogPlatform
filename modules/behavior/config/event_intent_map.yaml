# event_intent_map.yaml — 事件 → category → intent 映射
#
# 五类来源：audio_direct / audio_reaction / visual_direct / need / emotion

# ═══════════════════════════════════════════════════════════════════════════
# audio_direct — 白名单事件
# ═══════════════════════════════════════════════════════════════════════════

