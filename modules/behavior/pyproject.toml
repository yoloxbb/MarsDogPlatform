[build-system]
requires = ["setuptools==79.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marsdog-behavior"
version = "0.2.0"
description = "MarsDog Behavior Tree — priority-based behavior selection engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
maintainers = [
    { name = "MarsDog Team", email = "dev@marsdog.local" },
]
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
behavior-tree-demo = "bionic_dog_bt.demo:main"
marsdog-standalone = "marsdog_behavior.standalone_demo:main"
behavior_tree_node = "marsdog_behavior.ros_node:main"

[project.urls]
Repository = "https://github.com/yoloxbb/20260702_MarsDogTree"
