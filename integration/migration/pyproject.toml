[project]
name = "marsdog-migration-verification"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pytest>=9.1.1,<10",
  "build>=1.3,<2",
  "setuptools==79.0.1", # Baseline metadata failure is recorded; 69 also fails (PEP 639).
  "wheel>=0.45,<1",
  "colcon-common-extensions>=0.3,<1",
  "pyyaml>=6,<7",
  "empy==3.3.4", # Humble rosidl_adapter uses BUFFERED_OPT / RAW_OPT.
  "lark>=1.1,<2",
  "numpy>=1.26,<2", # ROS generator/tool environment only, not Action's runtime.
  "git-filter-repo==2.47.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
