name: BehaviorTree software checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bootstrap verified uv
        run: python3 -B tools/bootstrap_uv.py
      - name: Locked independent module environment
        run: .tools/uv sync --project modules/behavior --locked --python /usr/bin/python3.10
      - name: Existing and migration regressions
        working-directory: modules/behavior
        run: .venv/bin/python -B -m pytest tests marsdog_behavior/tests -q -p no:cacheprovider
      - name: Clean wheel install away from source
        run: python3 -B tools/check_behavior_install.py --uv "$GITHUB_WORKSPACE/.tools/uv"
