# GO2 + D435i + 外置 WIT IMU + OpenVINS 足式辅助 + RTAB-Map 平面建图。
# /odom_leg(child=base_footprint) 与机器人静态 TF 由用户单独启动；
# OpenVINS 独占发布 odom -> base_footprint。

openvins_stereo_odometry:
  ros__parameters:
    # ROS、同步和 TF
    use_sim_time: false
    frame_id: "base_footprint"


    odom_frame_id: "odom"
    publish_tf: true
    wait_for_transform: 0.2
    wait_imu_to_init: true
    subscribe_imu: true
    approx_sync: true
    approx_sync_max_interval: 0.01
    topic_queue_size: 5
    sync_queue_size: 5
    imu_queue_size: 1000
    leg_odom_queue_size: 200
    # /odom 输出使用 Reliable，匹配 Nav2 controller_server 的订阅 QoS。
    qos: 1
    qos_image: 2
    qos_camera_info: 2
    qos_imu: 2
    qos_leg_odom: 2

    # Kalibr 标定为 t_imu=t_cam+0.0118656 s，OpenVINS 还会在线估计该值。
    # 多取 30 ms 的未来 IMU，确保足式更新插值点两侧都有 IMU 样本。
    imu_lookahead: 0.03
    always_check_imu_tf: false
    always_process_most_recent_frame: false

    # OpenVINS odometry
    "Odom/Strategy": "10"
    "Odom/ResetCountdown": "0"
    "Odom/FillInfoData": "true"
    "Odom/ImageBufferSize": "1"
    "Odom/GuessMotion": "true"
    "Odom/FilteringStrategy": "0"
    "Odom/AlignWithGround": "false"
    # OpenVINS 内部仍估计完整 6DoF；RTAB-Map odometry 基类只发布 x/y/yaw。
    "Reg/Force3DoF": "true"
    "Odom/KeyFrameThr": "0.3"
    "Odom/VisKeyFrameThr": "120"

    # OpenVINS 直接使用 D435i 矫正后的双目图像和 ROS TF 外参。
    "OdomOpenVINS/ConfigPath": ""
    "OdomOpenVINS/UseStereo": "true"
    "OdomOpenVINS/UseKLT": "true"
    "OdomOpenVINS/NumPts": "800"
    "OdomOpenVINS/MinPxDist": "10"
    "FAST/Threshold": "10"
    "Vis/GridRows": "5"
    "Vis/GridCols": "5"
    "Vis/CorNNDR": "0.8"
    "Vis/MinDepth": "0.1"
    "Vis/MaxDepth": "10.0"
    "Vis/DepthAsMask": "true"

    "OdomOpenVINS/FiTriangulate1d": "false"
    "OdomOpenVINS/FiRefineFeatures": "true"
    "OdomOpenVINS/FiMaxRuns": "5"
    "OdomOpenVINS/FiMaxBaseline": "40"
    "OdomOpenVINS/FiMaxCondNumber": "10000"

    # 缩小滑窗和单次更新规模，降低偶发 300~450 ms 尖峰。
    "OdomOpenVINS/UseFEJ": "true"
    "OdomOpenVINS/Integration": "1"
    "OdomOpenVINS/CalibCamExtrinsics": "false"
    "OdomOpenVINS/CalibCamIntrinsics": "false"
    "OdomOpenVINS/CalibCamTimeoffset": "true"
    "OdomOpenVINS/CalibIMUIntrinsics": "false"
    "OdomOpenVINS/CalibIMUGSensitivity": "false"
    "OdomOpenVINS/MaxClones": "12"
    "OdomOpenVINS/MaxSLAM": "30"
    "OdomOpenVINS/MaxSLAMInUpdate": "20"
    "OdomOpenVINS/MaxMSCKFInUpdate": "60"
    "OdomOpenVINS/FeatRepMSCKF": "0"
    "OdomOpenVINS/FeatRepSLAM": "4"
    "OdomOpenVINS/DtSLAMDelay": "0.0"
    "OdomOpenVINS/GravityMag": "9.81"
    "OdomOpenVINS/LeftMaskPath": ""
    "OdomOpenVINS/RightMaskPath": ""

    "OdomOpenVINS/InitWindowTime": "2.0"
    "OdomOpenVINS/InitIMUThresh": "1.0"
    "OdomOpenVINS/InitMaxDisparity": "10.0"
    "OdomOpenVINS/InitMaxFeatures": "50"
    "OdomOpenVINS/InitDynUse": "false"
    "OdomOpenVINS/InitDynMLEOptCalib": "false"
    "OdomOpenVINS/InitDynMLEMaxIter": "50"
    "OdomOpenVINS/InitDynMLEMaxTime": "0.05"
    "OdomOpenVINS/InitDynMLEMaxThreads": "6"
    "OdomOpenVINS/InitDynNumPose": "6"
    "OdomOpenVINS/InitDynMinDeg": "10.0"
    "OdomOpenVINS/InitDynInflationOri": "10.0"
    "OdomOpenVINS/InitDynInflationVel": "100.0"
    "OdomOpenVINS/InitDynInflationBg": "10.0"
    "OdomOpenVINS/InitDynInflationBa": "100.0"
    "OdomOpenVINS/InitDynMinRecCond": "1e-15"

    "OdomOpenVINS/TryZUPT": "true"
    "OdomOpenVINS/ZUPTChi2Multiplier": "0.5"
    "OdomOpenVINS/ZUPTMaxVelodicy": "0.1"
    "OdomOpenVINS/ZUPTNoiseMultiplier": "10.0"
    "OdomOpenVINS/ZUPTMaxDisparity": "0.5"
    "OdomOpenVINS/ZUPTOnlyAtBeginning": "true"

    # WIT IMU 当前标定噪声。
    # "OdomOpenVINS/AccelerometerNoiseDensity": "0.08"
    # "OdomOpenVINS/AccelerometerRandomWalk": "0.004"
    # "OdomOpenVINS/GyroscopeNoiseDensity": "0.001"
    # "OdomOpenVINS/GyroscopeRandomWalk": "0.0001"

    "OdomOpenVINS/AccelerometerNoiseDensity": "0.02523"
    "OdomOpenVINS/AccelerometerRandomWalk": "0.000467"
    "OdomOpenVINS/GyroscopeNoiseDensity": "0.000608"
    "OdomOpenVINS/GyroscopeRandomWalk": "0.00001066"
    
    "OdomOpenVINS/UpMSCKFSigmaPx": "1.0"
    "OdomOpenVINS/UpMSCKFChi2Multiplier": "1.5"
    "OdomOpenVINS/UpSLAMSigmaPx": "1.0"
    "OdomOpenVINS/UpSLAMChi2Multiplier": "1.5"

    # 非对称迟滞：视觉首次没有实际 EKF 更新时立即使用 /odom_leg；视觉重新出现后继续足式辅助，
    # 只有连续恢复 0.5 s、每帧活动观测不少于 50 且累计接受约束不少于 12 时才回到纯视觉。
    # vz 使用 Go2 SportModeState 的真实垂直速度；Force3DoF 只负责将对外位姿压平。
    "OdomOpenVINS/LegVelocityEnabled": "true"
    "OdomOpenVINS/LegVelocityUseVertical": "true"
    "OdomOpenVINS/LegVelocityUseYawRate": "true"
    "OdomOpenVINS/LegVelocityTimeOffset": "0.0"
    "OdomOpenVINS/LegVelocityMaxAge": "0.20"
    "OdomOpenVINS/LegVelocityLossFrames": "3"
    "OdomOpenVINS/LegVelocityLossTime": "0.25"
    "OdomOpenVINS/LegVelocityRecoveryTime": "0.5"
    "OdomOpenVINS/LegVelocityMinActiveObservations": "50"
    "OdomOpenVINS/LegVelocityRecoveryAccepted": "12"
    "OdomOpenVINS/LegVelocityHorizontalVarianceFloor": "0.05"
    "OdomOpenVINS/LegVelocityVerticalVarianceFloor": "0.10"
    "OdomOpenVINS/LegVelocityYawRateVarianceFloor": "0.02"
    "OdomOpenVINS/LegVelocityChi2Multiplier": "1.0"
    "OdomOpenVINS/LegVelocityMaxLinearSpeed": "3.0"
    "OdomOpenVINS/LegVelocityMaxVerticalSpeed": "1.0"
    "OdomOpenVINS/LegVelocityMaxYawRate": "4.0"

    "Rtabmap/ImagesAlreadyRectified": "true"

rtabmap:
  ros__parameters:
    use_sim_time: false
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    publish_tf: true
    wait_for_transform: 0.2
    database_path: "~/.ros/rtabmap_go2_openvins_leg_mapping.db"
    delete_db_on_start: false

    subscribe_stereo: true
    subscribe_rgb: false
    subscribe_rgbd: false
    subscribe_depth: false
    stereo_to_depth: false
    subscribe_scan: false
    subscribe_scan_cloud: false
    subscribe_odom_info: true
    subscribe_imu: true
    approx_sync: true
    approx_sync_max_interval: 0.01
    topic_queue_size: 5
    sync_queue_size: 5
    qos: 2
    qos_image: 2
    qos_camera_info: 2

    # 兼顾稠密双目负载和局部避障时效；实测单帧约 0.3~0.4 秒。
    "Rtabmap/DetectionRate": "5.0"
    "Rtabmap/ImageBufferSize": "1"
    "Rtabmap/CreateIntermediateNodes": "false"
    "Rtabmap/ImagesAlreadyRectified": "true"
    "Rtabmap/LoopThr": "0.11"
    "Rtabmap/LoopRatio": "0"
    "Rtabmap/PublishStats": "true"
    "Rtabmap/PublishLastSignature": "true"
    "Rtabmap/PublishPdf": "false"
    "Rtabmap/PublishLikelihood": "false"
    "Rtabmap/MemoryThr": "0"
    # 限制回环检测占用时间，避免障碍点云因单帧计算过久继续积压。
    "Rtabmap/TimeThr": "450"


    "Mem/IncrementalMemory": "true"
    "Mem/LocalizationReadOnly": "false"
    "Mem/ImageKept": "false"
    "Mem/BinDataKept": "true"
    "Mem/RawDescriptorsKept": "true"
    "Mem/IntermediateNodeDataKept": "false"
    "Mem/InitWMWithAllNodes": "false"
    "Mem/UseOdomFeatures": "false"
    "Mem/UseOdomGravity": "true"
    "Mem/CovOffDiagIgnored": "true"

    "RGBD/Enabled": "true"
    "RGBD/LinearUpdate": "0.10"
    "RGBD/AngularUpdate": "0.10"
    "RGBD/LinearSpeedUpdate": "0.0"
    "RGBD/AngularSpeedUpdate": "0.0"
    "RGBD/OptimizeFromGraphEnd": "false"
    "RGBD/OptimizeMaxError": "1.5"
    "RGBD/ProximityBySpace": "true"
    "RGBD/ProximityByTime": "false"
    "RGBD/NeighborLinkRefining": "false"
    "RGBD/LoopClosureIdentityGuess": "false"
    "RGBD/LoopClosureReextractFeatures": "false"
    "RGBD/LocalBundleOnLoopClosure": "false"
    "RGBD/MaxLoopClosureDistance": "0.0"
    "RGBD/MaxOdomCacheSize": "10"

    "Reg/Strategy": "0"
    "Reg/Force3DoF": "true"
    "Reg/RepeatOnce": "true"
    "Vis/MinInliers": "20"
    "Vis/Iterations": "300"
    "Vis/FeatureType": "8"
    "Vis/MaxFeatures": "800"
    "Vis/SSC": "false"
    "Vis/DepthAsMask": "true"
    "Vis/MinDepth": "0.1"
    "Vis/MaxDepth": "6.0"
    "Vis/GridRows": "5"
    "Vis/GridCols": "5"
    "Vis/CorType": "0"
    "Vis/CorNNType": "1"
    "Vis/CorNNDR": "0.8"
    "Vis/CorGuessWinSize": "40"
    "Vis/PnPReprojError": "2.0"
    "Vis/PnPRefineIterations": "1"
    "Vis/PnPVarianceMedianRatio": "4"
    "Vis/BundleAdjustment": "1"

    "Kp/DetectorStrategy": "8"
    "Kp/MaxFeatures": "600"
    "Kp/BadSignRatio": "0.5"
    "Kp/NndrRatio": "0.8"
    "Kp/NNStrategy": "1"
    "Kp/IncrementalDictionary": "true"
    "Kp/IncrementalFlann": "true"

    "Optimizer/Strategy": "1"
    "Optimizer/Iterations": "15"
    "Optimizer/Epsilon": "0.00001"
    "Optimizer/Robust": "false"
    "Optimizer/VarianceIgnored": "false"
    "Optimizer/GravitySigma": "0.3"

    "Stereo/DenseStrategy": "0"
    "StereoBM/BlockSize": "15"
    "StereoBM/MinDisparity": "0"
    "StereoBM/NumDisparities": "64"
    "StereoBM/PreFilterSize": "9"
    "StereoBM/PreFilterCap": "31"
    "StereoBM/UniquenessRatio": "15"
    "StereoBM/TextureThreshold": "10"
    "StereoBM/SpeckleWindowSize": "100"
    "StereoBM/SpeckleRange": "4"
    # 原值 "-1"（关闭）。改为 1 启用左右视差一致性检查：只保留左右图互相验证
    # 通过的视差，D435i 红外弱纹理面上的错误匹配大部分在这一步被剔除。
    # 这是 BM 路径下代价最低的减噪手段，几乎不增加 CPU。
    "StereoBM/Disp12MaxDiff": "1"

    "RGBD/CreateOccupancyGrid": "true"
    "Grid/Sensor": "1"
    "Grid/CellSize": "0.05"
    # 原值 "0.02"。D435i 红外双目在 2 cm 处不存在有效视差，这段范围产出的
    # 只能是噪声。0.3 m 接近双目实际最小工作距离。
    "Grid/RangeMin": "0.3"
    "Grid/RangeMax": "3.0"
    "Grid/DepthDecimation": "6"
    "Grid/PreVoxelFiltering": "True"
    "Grid/NoiseFilteringRadius": "0.12"
    # 原值 "2"，比 rtabmap 默认值 5 更宽松（Parameters.h:923）。BM 的典型失效
    # 模式是成块错误视差，只要 2 个邻居就能互相"保活"，滤波形同虚设。恢复到 5。
    "Grid/NoiseFilteringMinNeighbors": "5"
    "Grid/3D": "true"
    "Grid/RayTracing": "true"
    "Grid/MapFrameProjection": "false"
    "Grid/NormalsSegmentation": "true"
    "Grid/GroundIsObstacle": "false"
    "Grid/FlatObstacleDetected": "false"
    "Grid/MaxGroundAngle": "45"
    # 原值 "12"，低于默认 20（Parameters.h:912）。邻居太少导致法线抖动，
    # 平地上的点法线一旦超过 MaxGroundAngle 就被误判成障碍，
    # 表现为地面"撒盐"式假障碍。恢复到 20。
    "Grid/NormalK": "20"
    "Grid/ClusterRadius": "0.15"
    # 原值 "12"。util3d_mapping.hpp:186 证实这是去掉地面后对剩余障碍点做
    # 欧氏聚类的丢弃门限：小于该点数的簇直接不写入地图。
    # 这是清除孤立散点最直接的开关，提高到 20。
    "Grid/MinClusterSize": "20"
    "Grid/MinGroundHeight": "-0.5"
    "Grid/MaxGroundHeight": "0.12"
    "Grid/MaxObstacleHeight": "0.7"
    # 三项原值均为 "0.0"（关闭）。GO2 行走时摆动的腿会进入 D435i 红外视野下方，
    # 生成随步态移动的假障碍。LocalMapMaker.hpp:92-108 的 cropBox 位于整条链最
    # 前端（法线分割和噪声滤波之前），是最省算力的过滤点，且 negative=true 表示
    # 删除 box 内的点。box 以 base_footprint 原点为中心：
    # x∈[-L/2,+L/2]、y∈[-W/2,+W/2]、z∈[0,H]（z 下界硬编码为 0，即地面）。
    # GO2 机身约 0.65×0.28×0.40 m，这里各留出摆腿余量。
    # 注意三项必须同时非 0，否则 Width/Height 会被源码忽略。
    "Grid/FootprintLength": "0.70"
    "Grid/FootprintWidth": "0.40"
    "Grid/FootprintHeight": "0.40"
    # 原值 "0.01"（rtabmap 默认，Parameters.h:926）。GlobalMap.cpp:102-137 的
    # fullUpdateNeeded() 一旦发现任一节点位姿变化超过该阈值，就 clear() 并重建整张
    # 全局栅格。0.01 m 远小于一个栅格边长，足式里程计的常态亚厘米抖动即可触发：
    # 实测 TimeUpdatingMaps p95 达 750~780 ms，且 /map 反复重建会经 Nav2 的
    # StaticLayer 传导成全局路径抖动。取一个栅格边长（Grid/CellSize 0.05），
    # 亚栅格位姿修正不再触发重建，回环等真实修正仍然会重建。
    "GridGlobal/UpdateError": "0.05"
    "GridGlobal/OccupancyThr": "0.5"
    "GridGlobal/ProbHit": "0.7"
    "GridGlobal/ProbMiss": "0.4"

rtabmap_viz:
  ros__parameters:
    use_sim_time: false
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_stereo: true
    # 直接订阅 /odom，初始化阶段没有历史 odom->base_footprint TF 时显示丢失状态，
    # 避免不断报 "Could not get odometry pose from TF"。
    subscribe_odom: true
    subscribe_odom_info: true
    approx_sync: true
    topic_queue_size: 5
    sync_queue_size: 5
    qos: 2
    qos_image: 2
    qos_camera_info: 2
