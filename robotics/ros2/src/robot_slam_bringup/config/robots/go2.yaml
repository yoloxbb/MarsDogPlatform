# 使用公共 MPPI/STVL；轮廓和速度边界来自原 GO2 配置。
schema_version: 1
robot: go2
label: 宇树 GO2
launch:
  base_frame: base_link
  odom_frame: odom
  map_frame: map
  sensor_frame: camera_infra1_optical_frame
  odom_topic: /odom
  cmd_vel_topic: /cmd_vel
  stereo_odom_topic: /vo
  database_path: ~/.ros/rtabmap_go2_d435i_mppi.db
  description_package: go2_description
  description_file: urdf/go2_description.urdf
  description_root_frame: ""
  publish_odom_tf: false  # 外部里程计/桥负责 TF；若只发 Odometry，可显式启用 relay。
sensor_mount:
  parent_frame: base_link
  child_frame: camera_link
  xyz: null
  rpy: null
nav2_overrides:
  local_costmap:
    local_costmap:
      ros__parameters:
        footprint: "[[0.38, 0.22], [0.38, -0.22], [-0.38, -0.22], [-0.38, 0.22]]"
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: "[[0.38, 0.22], [0.38, -0.22], [-0.38, -0.22], [-0.38, 0.22]]"
  controller_server:
    ros__parameters:
      FollowPath:
        vx_max: 0.40
        vx_min: -0.20  # 采用原 GO2 velocity_smoother 的后退速度边界。
        wz_max: 0.80
  behavior_server:
    ros__parameters:
      robot_radius: 0.44
      enable_strafe: false  # 当前统一导航为前后移动/转向；恢复行为也不横移。
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.40, 0.0, 0.80]
      min_velocity: [-0.20, 0.0, -0.80]
      max_accel: [1.0, 0.0, 1.5]
      max_decel: [-1.0, 0.0, -1.5]
provenance:
  description_repository: https://github.com/sun-under-bird/go2
  description_commit: 1519be2485f63e54349b85f6f766b574ea6ff700
  parameters: 原 go2_nav2.yaml 的轮廓与速度平滑边界；控制器按用户要求统一为 MPPI。
  odometry: 需要外部发布 /odom 和 odom 到 base_link 的 TF；本入口不启动底盘桥或 OpenVINS。
  outstanding: [本机 D435i 安装外参, 底盘桥实际话题及 TF 核对]
