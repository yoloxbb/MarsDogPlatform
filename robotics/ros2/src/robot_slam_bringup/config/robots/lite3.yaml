# 保留原 nav.launch.py 的 Lite3 默认接口和运动参数。
schema_version: 1
robot: lite3
label: 深度机器狗 Lite3
launch:
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
  sensor_frame: camera_infra1_optical_frame
  odom_topic: /leg_odom2
  cmd_vel_topic: /cmd_vel
  stereo_odom_topic: /vo
  database_path: ~/.ros/rtabmap_lite3_leg_d435i.db
  description_package: ""
  description_file: ""
  description_root_frame: ""
  publish_odom_tf: false  # 原底盘已经负责 odom -> base_footprint。
sensor_mount:
  parent_frame: base_footprint
  child_frame: camera_link
  xyz: null  # [x,y,z]，单位 m；填写本机实测值，不以零值代替未知标定。
  rpy: null  # [roll,pitch,yaw]，单位 rad。
nav2_overrides:
  local_costmap:
    local_costmap:
      ros__parameters:
        footprint: "[[0.34, 0.19], [0.34, -0.19], [-0.34, -0.19], [-0.34, 0.19]]"
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: "[[0.34, 0.19], [0.34, -0.19], [-0.34, -0.19], [-0.34, 0.19]]"
  controller_server:
    ros__parameters:
      FollowPath:
        vx_max: 0.5
        vx_min: -0.5
        wz_max: 1.2
  behavior_server:
    ros__parameters:
      robot_radius: 0.40
      enable_strafe: true  # 保留原 Lite3 恢复行为；MPPI 仍使用 DiffDrive。
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.5, 0.0, 1.2]
      min_velocity: [-0.5, 0.0, -1.2]
      max_accel: [1.5, 0.0, 2.8]
      max_decel: [-2.5, 0.0, -3.2]
provenance:
  parameters: 原 nav.launch.py 与 nav.yaml；不是重新测量的厂家尺寸。
  odometry: 外部底盘 nav_msgs/msg/Odometry，必须同时提供 odom 到 base_footprint 的 TF。
  outstanding: [本机 D435i 安装外参, Lite3 描述包]
