
# GO2 Nav2 参数：使用 VoxelLayer + DenoiseLayer，地图由 RTAB-Map 发布。
# GO2_MAP_FRAME、GO2_ODOM_FRAME 和 SLAM_WS_SHARE 由 launch 自动替换。

bt_navigator:
  ros__parameters:
    use_sim_time: False  # 使用系统时间
    global_frame: GO2_MAP_FRAME  # 导航全局坐标系
    robot_base_frame: base_footprint  # 机器人基座坐标系
    odom_topic: /odom  # 里程计话题
    bt_loop_duration: 20          # BT 循环周期，单位 ms
    default_server_timeout: 20    # 下游响应超时，单位 ms
    wait_for_service_timeout: 10000  # 等待服务上线，单位 ms
    # 恢复顺序：清图等待、后退 0.15 m、前进 0.30 m。
    default_nav_to_pose_bt_xml: "SLAM_WS_SHARE/config/navigate_to_pose_no_backup.xml"  # 单点导航行为树
    default_nav_through_poses_bt_xml: "SLAM_WS_SHARE/config/navigate_through_poses_no_backup.xml"  # 多点导航行为树
    plugin_lib_names:  # 行为树节点插件库
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # 使用系统时间

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # 使用系统时间

controller_server:
  ros__parameters:
    use_sim_time: False  # 使用系统时间
    controller_frequency: 20.0  # 必须与 MPPI model_dt=0.05 s 对应
    odom_topic: /odom  # 控制器里程计话题
    min_x_velocity_threshold: 0.001  # 过滤足式里程计的低速抖动
    min_y_velocity_threshold: 0.001  # 横向速度零值阈值，单位 m/s
    min_theta_velocity_threshold: 0.001  # 角速度零值阈值，单位 rad/s
    failure_tolerance: 0.5  # 容忍短暂无解，避免偶发失败立即触发恢复
    progress_checker_plugin: "progress_checker"  # 进度检测器名称
    goal_checker_plugins: ["general_goal_checker"]  # 到达判定插件列表
    controller_plugins: ["FollowPath"]  # 路径跟随插件列表

    progress_checker:  # 机器人移动进度检测配置
      plugin: "nav2_controller::PoseProgressChecker"  # 同时检测位移和转角
      required_movement_radius: 0.06   # 小位移也视为四足正在脱困
      required_movement_angle: 0.35   # 原地转向也视为有效进展
      movement_time_allowance: 5.0    # 较快识别卡住并进入恢复

    general_goal_checker:  # 通用目标到达判定配置
      stateful: True  # 到达位置后保持位置已满足状态
      plugin: "nav2_controller::SimpleGoalChecker"  # 简单位姿目标检测器
      xy_goal_tolerance: 0.3   # 位置容差，单位 m
      yaw_goal_tolerance: 0.3  # 航向容差，单位 rad

    FollowPath:  # MPPI 路径跟随配置
      plugin: "nav2_mppi_controller::MPPIController"  # MPPI 控制器插件
      visualize: False  # 关闭候选轨迹可视化以降低算力占用
      reset_period: 1.0  # 空闲后重置旧控制序列
      model_dt: 0.05  # 模型采样周期，单位 s
      time_steps: 60    # 预测时域为 60 × 0.05 = 3 s
      batch_size: 1500  # Jetson 上采样质量与实时性的折中
      iteration_count: 1  # 每周期优化迭代次数
      temperature: 0.3  # 平衡最优轨迹偏好与输出平滑性
      gamma: 0.015       # 抑制相邻控制周期的指令跳变
      vx_max: 0.5   # 最大前进速度，单位 m/s
      vx_min: -0.5  # 最大后退速度，单位 m/s
      wz_max: 1.2   # 最大角速度，单位 rad/s
      vx_std: 0.3  # 扩大线速度采样范围
      wz_std: 0.5  # 原值 0.8（默认 0.4）。采样噪声过大时 MPPI 更容易探到打满 wz_max 的解，实测 wz 在 ±1.2 间饱和翻转
      retry_attempt_limit: 2  # 全轨迹碰撞时允许重采样
      motion_model: "DiffDrive"  # 差速运动模型
      prune_distance: 3.0  # 与 3 秒预测距离保持同一量级
      transform_tolerance: 0.2  # TF 允许延迟，单位 s

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic", "VelocityDeadbandCritic"]  # 轨迹评价器列表

      ConstraintCritic:  # 运动学约束评价
        cost_power: 1  # 代价指数
        cost_weight: 4.0  # 约束代价权重

      ObstaclesCritic:  # 障碍物碰撞与避障评价
        enabled: true  # 启用障碍评价
        cost_power: 1  # 代价指数
        # 原值 5.0，为默认 1.5 的 3.3 倍。obstacles_critic.cpp:181 的斥力为
        # (inflation_radius - dist_to_obj) 逐点累加，inflation_radius 同时是斥力的
        # 幅值标尺和作用范围，因此半径 0.25→0.4 已经放大过一次斥力，再叠 3.3 倍权重
        # 会在走廊内被两侧墙交替强推，配合被削弱的角速度阻尼形成饱和摆头。
        # 居中交给全局侧的 cost_penalty 与平滑器 w_cost，MPPI 只负责跟随。
        repulsion_weight: 2.0  # 略高于默认，保留离墙偏好但不足以自激振荡
        critical_weight: 20.0  # 临近碰撞区惩罚权重
        consider_footprint: true  # 使用完整机身轮廓碰撞检测
        collision_cost: 1000000.0  # 碰撞轨迹惩罚值
        collision_margin_distance: 0.10  # 额外安全距离，单位 m
        near_goal_distance: 0.6  # 近目标判定距离，单位 m
        inflation_radius: 0.4       # 与局部膨胀层保持一致
        cost_scaling_factor: 8.0     # 与局部膨胀层保持一致

      GoalCritic:  # 终点距离评价
        cost_power: 1  # 代价指数
        cost_weight: 5.0  # 目标距离权重
        threshold_to_consider: 1.4  # 启用评价的目标距离，单位 m

      # 原先未启用此评价器，导致位置进容差后无任何一项驱动机器人转到目标朝向：
      # goal_critic.cpp:44-56 只算终点欧氏距离，完全不含朝向项，
      # 而 SimpleGoalChecker 的 stateful=True 在位置达标后只检查朝向
      # （simple_goal_checker.cpp:103-134），于是终点判定永远不满足。
      GoalAngleCritic:  # 终点朝向评价
        cost_power: 1  # 代价指数
        cost_weight: 6.0  # 高于 TwirlingCritic，确保末端转向不被旋转惩罚压制
        threshold_to_consider: 0.5  # 须大于 xy_goal_tolerance 0.3，否则进容差圈才生效已太晚

      PathAlignCritic:  # 路径横向对齐评价
        cost_power: 1  # 代价指数
        cost_weight: 10.0  # 原值 14.0（默认 10.0）。横向贴合过强会用剧烈摆头去消除横向偏差，与低航向权重叠加成过冲振荡
        max_path_occupancy_ratio: 0.05  # 路径占用率上限
        offset_from_furthest: 20  # 最远已达点后的路径偏移点数
        trajectory_point_step: 4  # 轨迹评价采样步长
        threshold_to_consider: 0.7  # 近目标停用距离，单位 m
        use_path_orientations: false  # 不强制匹配路径点朝向

      PathFollowCritic:  # 路径前向跟随评价
        threshold_to_consider: 1.4  # 近目标停用距离，单位 m
        offset_from_furthest: 6  # 前向目标点偏移点数
        cost_power: 1  # 代价指数
        cost_weight: 5.0  # 路径跟随权重

      PathAngleCritic:  # 路径方向评价
        offset_from_furthest: 4  # 方向参考点偏移点数
        cost_power: 1  # 代价指数
        cost_weight: 2.2  # 原值 1.0（默认 2.2）。航向约束过弱时机器人靠摆头而非提前对齐来跟线，恢复默认以抑制振荡
        threshold_to_consider: 0.7  # 近目标停用距离，单位 m
        max_angle_to_furthest: 1.0  # 最大方向偏差，单位 rad
        forward_preference: true  # 优先以前向姿态跟随路径

      PreferForwardCritic:  # 前向运动偏好评价
        cost_power: 1  # 代价指数
        cost_weight: 5.0  # 倒退惩罚权重
        threshold_to_consider: 0.5  # 近目标停用距离，单位 m

      TwirlingCritic:  # 原地旋转评价
        cost_power: 1  # 代价指数
        # 原值 0.3，仅为默认 10.0 的 3%，等于关掉了角速度阻尼——这是摆头无法衰减的主因之一。
        # twirling_critic.cpp:36-38 在位置进入 xy_goal_tolerance 后直接 return 自动停用，
        # 因此提高本项不会妨碍 GoalAngleCritic 完成末端转向，两者作用区间不重叠。
        cost_weight: 4.0  # 恢复行进段的角速度阻尼，同时保留四足的转向灵活性

      VelocityDeadbandCritic:  # 最小有效速度评价
        cost_power: 1  # 代价指数
        # 本评价不随接近终点而停用（velocity_deadband_critic.cpp:45 只判断 enabled_，
        # 不像 TwirlingCritic/PreferForwardCritic 那样检查位置容差），且惩罚形式为
        # max(deadband-|v|,0)，零速度时惩罚最大，会在终点持续推动机身蹭动、扰动末端偏航。
        # 降权让它在终点让位给 GoalAngleCritic，行进段的死区约束仍然保留。
        cost_weight: 4.0  # 死区速度惩罚权重
        # wz 项原为 0.12。惩罚形式 max(deadband-|wz|,0) 会给 wz=0 打出最大惩罚，
        # 等于主动排斥直线行驶——最优解变成"左右交替小转"，是摆头的一个独立来源。
        # 本评价的用途是线速度死区（指令小于死区时机器人不动而 MPPI 以为在动），
        # 角速度不适用；velocity_smoother 的 deadband_velocity 也是全零，未做死区处理。
        deadband_velocities: [0.08, 0.0, 0.0]  # [vx, vy, wz]，仅保留前进死区

# 局部代价地图：供控制器和恢复行为使用。
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 12.0  # 兼顾动态避障时效与 CPU 占用
      publish_frequency: 5.0  # 代价地图发布频率，单位 Hz
      global_frame: GO2_ODOM_FRAME  # 局部代价地图坐标系
      robot_base_frame: base_footprint  # 机器人基座坐标系
      use_sim_time: False  # 使用系统时间
      transform_tolerance: 0.2  # TF 允许延迟，单位 s
      rolling_window: true  # 代价地图跟随机器人移动
      width: 6       # 单位 m
      height: 6      # 单位 m
      resolution: 0.05  # 单位 m/格
      # GO2 机身轮廓：0.76 m × 0.32 m。
      footprint: "[[0.38, 0.16], [0.38, -0.16], [-0.38, -0.16], [-0.38, 0.16]]"  # 机身碰撞轮廓
      # 图层顺序：STVL 时空体素、孤立点去噪、障碍膨胀。
      plugins: ["stvl_layer", "denoise_layer", "inflation_layer"]  # 局部代价地图图层

      # SpatioTemporalVoxelLayer 替代 VoxelLayer 的理由：
      # VoxelLayer 的清除依赖 3D 射线（voxel_grid.hpp ClearVoxelInMap），一条射线穿过
      # 某个 (x,y) 列时只清掉一个 z 位，而 2D 栅格要降到 marked <= mark_threshold 才
      # 转为自由，因此清空一格需要多条不同俯仰角的射线；D435i 87°x58° 的视锥无法为
      # 6x6 m 局部图的侧后方提供任何清除射线，残留障碍只能等 rolling window 淘汰。
      # STVL 的体素带时间戳并按 voxel_decay 自然过期，不依赖射线覆盖，视锥外的鬼影
      # 也会自行消失。插件位于 /opt/ros/humble（libspatio_temporal_voxel_layer_core.so，
      # 依赖 openvdb_vendor，由 ROS 环境 hook 提供）。
      stvl_layer:  # 时空体素障碍层配置
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"  # STVL 插件
        enabled: true  # 启用时空体素层
        # 体素在无新观测后的存活时间。必须远大于点云周期（实测 /local_grid_obstacle
        # 约 1.7~2.5 Hz，即 0.4~0.6 s），否则视野内的真实障碍会在两帧之间被衰减掉；
        # 视野内持续被观测的障碍每帧刷新时间戳，不会过期。5 s 兼顾鬼影清除与安全余量。
        voxel_decay: 2.0  # 单位 s（decay_model=0 时为线性存活时间）
        decay_model: 0  # 0=线性衰减，1=指数衰减，-1=永久保留
        voxel_size: 0.05  # 与代价地图 resolution 一致，单位 m
        # 必须为 false：相机水平视场仅约 71°，若把未观测区域标记为 NO_INFORMATION，
        # 机器人会被大片未知区域包围而不敢运动。原 VoxelLayer 局部层同样未开启此项。
        track_unknown_space: false  # 未观测区域视为自由空间
        mark_threshold: 0  # 上游 RTAB-Map 已做 MinClusterSize=20 聚类过滤，无需再设门限
        update_footprint_enabled: true  # 清除机身轮廓内障碍
        combination_method: 1  # Max 合并
        origin_z: 0.0  # 体素层起始高度，单位 m
        publish_voxel_map: false  # 不发布调试体素地图，节省 Jetson 算力
        transform_tolerance: 0.2  # TF 允许延迟，单位 s
        mapping_mode: false  # 导航模式，不做离线建图存盘
        map_save_duration: 60.0  # mapping_mode 关闭时不生效，单位 s
        observation_sources: rtabmap_mark rtabmap_clear  # 标记源与视锥清除源

        # 标记源：RTAB-Map 已完成法线地面分割、噪声滤波与欧氏聚类，
        # 此处只做高度带粗过滤，不再重复 3D 判断。
        rtabmap_mark:  # 障碍标记观测源
          data_type: PointCloud2  # 点云消息类型
          topic: /local_grid_obstacle  # RTAB-Map 已去地面的障碍点云
          marking: true  # 使用点云标记障碍
          clearing: false  # 标记源不参与清除
          obstacle_range: 3.0  # 与 Grid/RangeMax 及 MPPI 预测范围匹配，单位 m
          min_obstacle_height: 0.15  # 避开地面与 GO2 摆腿，单位 m
          max_obstacle_height: 0.45  # 图层有效障碍高度上限，单位 m
          expected_update_rate: 0.0  # 不启用更新率超时检查
          observation_persistence: 0.0  # 只使用最新观测，单位 s
          inf_is_valid: false  # 点云无需处理 inf（该项针对激光扫描）
          filter: "passthrough"  # 点云已由 Grid/DepthDecimation=6 稀疏到约 200 点，无需体素降采样
          voxel_min_points: 0  # filter 为 voxel 时才生效
          clear_after_reading: true  # 读取后清空缓冲，避免同批点云重复标记

        # 清除源：STVL 不做射线追踪，而是用视锥模型找出"本应观测到却没有回波"
        # 的体素并加速其衰减，因此与标记源共用同一话题（官方 example 亦如此）。
        rtabmap_clear:  # 视锥加速清除源
          data_type: PointCloud2  # 点云消息类型
          topic: /local_grid_obstacle  # 与标记源同话题，仅用于构造视锥
          marking: false  # 清除源不标记障碍
          clearing: true  # 启用视锥加速衰减
          min_z: 0.1  # 视锥近端，单位 m
          max_z: 3.0  # 视锥远端，与 obstacle_range 对齐，单位 m
          # D435i 深度视场 87°x58° 是 16:9 标称值；当前 camera_profile 为 640x480(4:3)，
          # 垂直保持 58°(1.01 rad)，水平裁剪至约 71°(1.24 rad)。
          vertical_fov_angle: 1.01  # 垂直视场角，单位 rad
          horizontal_fov_angle: 1.24  # 水平视场角，单位 rad
          # /local_grid_obstacle 的 frame 是 base_footprint（位于地面），而非相机光心
          # （高约 0.35 m），视锥顶点因此偏低；用垂直填充补偿这一几何偏差。
          vertical_fov_padding: 0.2  # 垂直视场填充，单位 m
          # 因上述 frame 偏差导致视锥判定不够精确，取低于官方示例 15.0 的保守值，
          # 主要依赖 voxel_decay 的时间衰减，视锥仅作温和加速。
          decay_acceleration: 5.0  # 视锥内缺失观测的加速衰减系数，单位 1/s²
          model_type: 0  # 0=深度相机视锥模型，1=3D 激光雷达

      denoise_layer:  # 孤立障碍去噪层配置
        plugin: "nav2_costmap_2d::DenoiseLayer"  # 去噪图层插件
        enabled: true  # 启用去噪图层
        minimal_group_size: 2       # 删除孤立单栅格障碍
        group_connectivity_type: 8  # 八邻域连通

      inflation_layer:  # 障碍膨胀层配置
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀图层插件
        enabled: True  # 启用膨胀图层
        cost_scaling_factor: 8.0  # 与 MPPI ObstaclesCritic 一致
        inflation_radius: 0.4    # 单位 m
      always_send_full_costmap: False  # 优先发布局部增量更新

# 全局代价地图：供全局规划和平滑器使用。
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5  # 全局代价地图更新频率，单位 Hz
      publish_frequency: 0.5  # 全局代价地图发布频率，单位 Hz
      global_frame: GO2_MAP_FRAME  # 全局代价地图坐标系
      robot_base_frame: base_footprint  # 机器人基座坐标系
      use_sim_time: False  # 使用系统时间
      transform_tolerance: 0.2  # TF 允许延迟，单位 s
      footprint: "[[0.38, 0.16], [0.38, -0.16], [-0.38, -0.16], [-0.38, 0.16]]"  # 机身碰撞轮廓
      resolution: 0.05  # 单位 m/格
      track_unknown_space: true  # 保留未知区域状态
      plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]  # 全局代价地图图层
      static_layer:  # 静态地图层配置
        plugin: "nav2_costmap_2d::StaticLayer"  # 静态地图图层插件
        enabled: True  # 启用静态地图层
        map_topic: /map  # RTAB-Map 占据栅格
        map_subscribe_transient_local: False  # 使用普通地图订阅
        subscribe_to_updates: True  # 接收地图增量更新

      voxel_layer:  # 三维体素障碍层配置
        plugin: "nav2_costmap_2d::VoxelLayer"  # 体素图层插件
        enabled: true  # 启用体素图层
        footprint_clearing_enabled: true  # 清除机身轮廓内障碍
        max_obstacle_height: 0.45  # 图层最大障碍高度，单位 m
        origin_z: 0.0  # 体素层起始高度，单位 m
        z_resolution: 0.05  # 垂直体素分辨率，单位 m
        z_voxels: 10  # 垂直体素数量
        unknown_threshold: 9  # 体素列未知状态阈值
        mark_threshold: 1    # 与局部层一致：至少两个体素才投影为障碍。原值 0 意味着单个体素即成障碍，D435i 弱纹理面上逐帧变化的散点会让全局障碍格反复出现消失，直接传导为全局路径抖动
        combination_method: 1  # Max 合并
        publish_voxel_map: false  # 不发布调试体素地图
        observation_sources: obstacle_mark  # 点云观测源列表

        obstacle_mark:  # 障碍点云观测源
          topic: /local_grid_obstacle  # 障碍点云话题
          data_type: "PointCloud2"  # 点云消息类型
          marking: true  # 使用点云标记障碍
          clearing: true  # 使用点云射线清除障碍
          min_obstacle_height: 0.10  # 最小障碍高度，单位 m
          max_obstacle_height: 0.45  # 最大障碍高度，单位 m
          obstacle_max_range: 3.0  # 最大障碍标记距离，单位 m
          obstacle_min_range: 0.2  # 最小障碍标记距离，单位 m
          raytrace_max_range: 3.2  # 最大射线清除距离，单位 m
          raytrace_min_range: 0.0  # 最小射线清除距离，单位 m
          observation_persistence: 0.0  # 不保留历史观测，单位 s
          expected_update_rate: 0.0  # 不启用更新率超时检查

      denoise_layer:  # 孤立障碍去噪层配置
        plugin: "nav2_costmap_2d::DenoiseLayer"  # 去噪图层插件
        enabled: true  # 启用去噪图层
        minimal_group_size: 2       # 删除孤立单栅格障碍
        group_connectivity_type: 8  # 八邻域连通

      inflation_layer:  # 障碍膨胀层配置
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀图层插件
        enabled: True  # 启用膨胀图层
        cost_scaling_factor: 8.0  # 衰减放缓，抬高 0.4 m 膨胀带内代价以增强推离效果；刻意低于局部层的 6.0，全局求居中、局部求通过性
        inflation_radius: 0.8  # 单位 m
      always_send_full_costmap: True  # 每次发布完整全局代价地图

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # 期望规划频率，单位 Hz
    use_sim_time: False  # 使用系统时间
    planner_plugins: ["GridBased"]  # 全局规划插件列表
    GridBased:  # Hybrid-A* 全局规划配置
      plugin: "nav2_smac_planner/SmacPlannerHybrid"  # 混合栅格规划器插件
      downsample_costmap: false  # 使用原始代价地图分辨率
      tolerance: 0.20  # 目标容差，单位 m
      allow_unknown: false  # 不规划穿越未探索区域
      max_iterations: 1000000  # 搜索最大迭代次数
      max_on_approach_iterations: 1000  # 接近目标后的最大迭代次数
      max_planning_time: 2.0  # 单次规划超时，单位 s
      motion_model_for_search: "DUBIN"  # 全局路径只前进，倒车仅用于局部脱困
      angle_quantization_bins: 72  # 航向离散数量
      analytic_expansion_ratio: 3.5  # 解析扩展尝试间隔系数
      analytic_expansion_max_length: 1.2  # 缩短直连段：解析扩展只做碰撞检查、不评代价，过长会切内角贴墙
      minimum_turning_radius: 0.10  # 与平滑器保持一致
      change_penalty: 0.0  # 换向惩罚系数
      non_straight_penalty: 1.5  # 非直线运动惩罚系数
      cost_penalty: 5.0  # 提高远离高代价障碍的偏好
      retrospective_penalty: 0.025  # 延后搜索节点的惩罚系数
      lookup_table_size: 20.0  # 启发式查找表边长，单位 m
      # a_star.cpp:185 仅在目标点变化时重置障碍启发式，因此同一次导航任务内
      # 逐次重规划复用同一份启发式，消除"地图微变→启发式变→展开顺序变→路径跳变"的链路，
      # 同时省去每次重规划的 Dijkstra 波前计算。碰撞检查始终使用最新代价地图，安全性不受影响。
      # 代价是启发式随机器人前进逐渐失准，搜索效率下降；若出现规划超时请改回 false。
      cache_obstacle_heuristic: false
      smooth_path: True  # 启用规划器内置平滑
      # 内置平滑不读代价地图，纯几何拉直会把撑开的余量往内角抹回去；
      # 降权后仅作兜底，居中交给 smoother_server 的 constrained_smoother。
      smoother:  # 内置路径平滑参数
        max_iterations: 1000  # 平滑最大迭代次数
        w_smooth: 0.15  # 降低几何拉直强度，减少切内角
        w_data: 0.35  # 提高原路径保真，保住 A* 撑出的离墙余量
        tolerance: 1.0e-10  # 平滑收敛阈值
        do_refinement: True  # 启用多轮细化

smoother_server:
  ros__parameters:
    use_sim_time: False  # 使用系统时间
    # 平滑器读全局代价地图做避障优化，是唯一能把路径推离墙面的环节。
    costmap_topic: global_costmap/costmap_raw  # 显式指向全局代价地图
    footprint_topic: global_costmap/published_footprint  # 全局代价地图机身轮廓
    robot_base_frame: base_footprint  # 覆盖默认 base_link，与本项目 TF 一致
    transform_tolerance: 0.2  # 与其他节点保持一致，单位 s
    smoother_plugins: ["constrained_smoother"]  # 路径平滑插件列表
    constrained_smoother:  # 约束路径平滑配置
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"  # Ceres 约束平滑器
      reversing_enabled: false  # 与 DUBIN 前向规划保持一致
      path_downsampling_factor: 3  # 减少 Ceres 优化规模
      path_upsampling_factor: 1  # 平滑后路径上采样倍数
      keep_start_orientation: true  # 保持起点方向
      keep_goal_orientation: true  # 保持终点方向
      minimum_turning_radius: 0.10  # 与规划器保持一致
      w_curve: 0.1  # 四足可小半径转向，不额外惩罚曲率
      w_dist: 0.0  # 原路径距离项权重
      w_smooth: 2000000.0  # 路径平滑项权重
      w_cost: 0.05  # 提高代价项权重，主动把路径推离膨胀带（原 0.015 为库默认值）
      optimizer:  # Ceres 优化器参数
        linear_solver_type: "SPARSE_NORMAL_CHOLESKY"  # 稀疏 Cholesky 求解器
        max_iterations: 70  # 限制单次平滑耗时
        debug_optimizer: false  # 关闭优化调试输出
        gradient_tol: 5000.0  # 梯度收敛阈值
        fn_tol: 1.0e-15  # 目标函数收敛阈值
        param_tol: 1.0e-20  # 参数变化收敛阈值

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw  # 恢复行为使用的代价地图
    footprint_topic: local_costmap/published_footprint  # 恢复行为使用的机身轮廓
    cycle_frequency: 15.0  # 恢复行为执行频率，单位 Hz
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # 可用恢复行为列表
    spin:  # 原地旋转行为配置
      plugin: "nav2_behaviors/Spin"  # 原地旋转插件
    backup:  # 后退脱困行为配置
      plugin: "nav2_behaviors/BackUp"  # 后退行为插件
    drive_on_heading:  # 定向直行行为配置
      plugin: "nav2_behaviors/DriveOnHeading"  # 定向直行插件
    wait:  # 等待行为配置
      plugin: "nav2_behaviors/Wait"  # 等待行为插件
    assisted_teleop:  # 辅助遥控行为配置
      plugin: "nav2_behaviors/AssistedTeleop"  # 碰撞检测遥控插件
    global_frame: GO2_ODOM_FRAME  # 恢复行为固定坐标系
    robot_base_frame: base_footprint  # 机器人基座坐标系
    transform_tolerance: 0.2  # TF 允许延迟，单位 s
    use_sim_time: False  # 使用系统时间
    simulate_ahead_time: 1.0  # 移动前先用局部图预测碰撞
    max_rotational_vel: 0.6   # 单位 rad/s
    min_rotational_vel: 0.18  # 单位 rad/s
    rotational_acc_lim: 1.6   # 单位 rad/s²

waypoint_follower:
  ros__parameters:
    use_sim_time: False  # 使用系统时间
    loop_rate: 20  # 航点任务循环频率，单位 Hz
    stop_on_failure: false  # 单个航点失败后继续后续航点
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 航点任务执行器名称
    wait_at_waypoint:  # 航点等待任务配置
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 航点等待插件
      enabled: True  # 启用航点等待任务
      waypoint_pause_duration: 200  # 航点停留时间，单位 ms

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # 使用系统时间
    smoothing_frequency: 20.0  # 速度平滑输出频率，单位 Hz
    scale_velocities: False  # 各速度轴独立限幅
    feedback: "OPEN_LOOP"  # 避免足式里程计速度噪声影响平滑
    max_velocity: [0.5, 0.0, 1.2]     # [vx, vy, wz]
    min_velocity: [-0.5, 0.0, -1.2]   # [vx, vy, wz]
    max_accel: [1.5, 0.0, 2.8]        # [ax, ay, aw]
    max_decel: [-2.5, 0.0, -3.2]      # 更快减速以缩短遇障停车距离
    deadband_velocity: [0.0, 0.0, 0.0]  # 输出速度死区 [vx, vy, wz]
    velocity_timeout: 0.5  # 指令超时停车，单位 s
